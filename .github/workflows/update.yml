name: Update Pipeline Status

# The fetch itself runs on Databricks (databricks.yml, on the hour every 6 h):
# both Postgres servers are private-endpoint only. This job only copies the
# result from the dev blob into the repo, which triggers the site deploy.
on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pipelines.json from blob
        env:
          SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          curl -fsS -o data/pipelines.json \
            "https://imb0chd0dev.blob.core.windows.net/projects/ds-pipelines-status/pipelines.json?${SAS#\?}"
          python3 -c "import json; d = json.load(open('data/pipelines.json')); print(d['generated_at'], len(d['pipelines']), 'jobs')"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipelines.json
          git diff --staged --quiet || git commit -m "Update pipeline status"
          git push
