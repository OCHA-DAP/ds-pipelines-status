<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSCI Pipeline Status</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>DSCI Databricks Pipeline Status</h1>
      <div class="header-meta">
        <button type="button" id="warnings-button" class="warnings-button" hidden></button>
        <span class="last-updated" id="last-updated"></span>
      </div>
    </div>

    <div class="filters">
      <input type="search" id="filter-search" placeholder="Search jobs" aria-label="Search jobs">
      <select id="filter-type" aria-label="Type"><option value="">All types</option></select>
      <select id="filter-hazard" aria-label="Hazard"><option value="">All hazards</option></select>
      <select id="filter-status" aria-label="Status"><option value="">All statuses</option></select>
      <select id="filter-compute" aria-label="Compute policy"><option value="">All compute</option></select>
      <button type="button" id="filter-clear" class="filter-clear" hidden>Clear</button>
      <span class="filter-count" id="filter-count"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th>Job</th>
          <th>Description</th>
          <th>Tasks</th>
          <th>Schedule</th>
          <th class="sortable" data-sort="runtime" aria-sort="none"><button type="button">Runtime <span class="sort-arrow" aria-hidden="true">↕</span></button></th>
          <th>Compute</th>
          <th class="sortable" data-sort="status" aria-sort="none"><button type="button">Status <span class="sort-arrow" aria-hidden="true">↕</span></button></th>
          <th>Tags</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
      <tfoot id="table-footer" hidden>
        <tr><td colspan="8" class="untagged-count" id="untagged-count"></td></tr>
      </tfoot>
    </table>
  </div>

  <div id="schema-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Output Schema</h2>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
